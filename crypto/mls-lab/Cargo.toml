[package]
name = "echo-mls-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
wasm-bindgen = "=0.2.105"
getrandom_old = { package = "getrandom", version = "=0.2.16", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
